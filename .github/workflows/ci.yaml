name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  release-readiness:
    name: Validate release candidate
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Resolve package version
        id: version
        run: |
          package_version="$(php -r '$package = json_decode(file_get_contents("assets/package.json"), true, flags: JSON_THROW_ON_ERROR); echo $package["version"];')"

          if [[ ! "${package_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid package version: ${package_version}"
            exit 1
          fi

          echo "tag=v${package_version}" >> "${GITHUB_OUTPUT}"

      - name: Verify changelog fragments were consumed
        run: |
          if compgen -G 'changelog/unreleased/*.md' > /dev/null; then
            echo "Unconsumed changelog fragments remain:"
            find changelog/unreleased -maxdepth 1 -name '*.md' -print
            exit 1
          fi

      - name: Verify release notes
        run: php tools/changelog/extract-release-notes.php "${{ steps.version.outputs.tag }}"

  fresh-symfony-app:
    name: Fresh Symfony application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer
          extensions: mbstring, intl

      - name: Run fresh application smoke test
        run: tools/smoke-test/fresh-symfony-app.sh

  quality:
    name: PHP ${{ matrix.php-version }} / ${{ matrix.dependency-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.4'
          - '8.5'
        dependency-version:
          - highest
          - lowest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer
          extensions: mbstring, intl, pdo_sqlite

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: |
          if [ "${{ matrix.dependency-version }}" = "lowest" ]; then
            composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
          else
            composer update --prefer-stable --no-interaction --no-progress
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Run PHPUnit
        run: vendor/bin/phpunit

      - name: Run frontend tests
        run: npm run test:frontend

      - name: Run PHPStan
        run: composer phpstan

      - name: Run PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --config=.php-cs-fixer.dist.php

      - name: Run twigcs
        run: vendor/bin/twigcs templates --config=.twig-cs-fixer.php
