name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  integrity:
    name: Validate release integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Validate tag format
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid tag format: ${GITHUB_REF_NAME}"
            echo "Expected format: v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi

      - name: Verify tag belongs to main
        run: |
          git fetch --no-tags origin main

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} does not point to a commit reachable from main."
            exit 1
          fi

      - name: Verify package version
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          package_version="$(php -r '$package = json_decode(file_get_contents("assets/package.json"), true, flags: JSON_THROW_ON_ERROR); echo $package["version"];')"

          if [[ "${release_version}" != "${package_version}" ]]; then
            echo "Tag version ${release_version} does not match assets/package.json version ${package_version}."
            exit 1
          fi

      - name: Verify changelog fragments were consumed
        run: |
          if compgen -G 'changelog/unreleased/*.md' > /dev/null; then
            echo "Unconsumed changelog fragments remain:"
            find changelog/unreleased -maxdepth 1 -name '*.md' -print
            exit 1
          fi

      - name: Extract release notes
        run: php tools/changelog/extract-release-notes.php "${GITHUB_REF_NAME}" > release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 1

  quality:
    name: PHP ${{ matrix.php-version }} / ${{ matrix.dependency-version }}
    needs: integrity
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.4'
          - '8.5'
        dependency-version:
          - highest
          - lowest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer
          extensions: mbstring, intl, pdo_sqlite

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: |
          if [[ "${{ matrix.dependency-version }}" == "lowest" ]]; then
            composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
          else
            composer update --prefer-stable --no-interaction --no-progress
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Run PHPUnit
        run: vendor/bin/phpunit

      - name: Run frontend tests
        run: npm run test:frontend

      - name: Run PHPStan
        run: composer phpstan

      - name: Run PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --config=.php-cs-fixer.dist.php

      - name: Run twigcs
        run: vendor/bin/twigcs templates --config=.twig-cs-fixer.php

  release:
    name: Create GitHub release
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=(--verify-tag)

          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            "${release_flags[@]}"
