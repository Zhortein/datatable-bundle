zhortein_datatable:
    default_provider: array
    default_theme: bootstrap
    default_page_size: 15
    max_page_size: 120
    search_enabled: true
    search_builder_enabled: true
    icons:
        action_view: smoke-icon-view
    bootstrap:
        table:
            striped: false
            hover: false
            bordered: true
            borderless: false
            small: true
            responsive: false
    export:
        csv:
            delimiter: ';'
            enclosure: '|'
            escape: '!'
            bom: true
