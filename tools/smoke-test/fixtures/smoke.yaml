app_smoke:
    path: /smoke
    controller: App\Controller\SmokeController
    methods: [GET]

app_smoke_user:
    path: /smoke/users/{id}
    controller: App\Controller\SmokeController
    methods: [GET]

app_smoke_users_archive:
    path: /smoke/users/archive
    controller: App\Controller\SmokeController
    methods: [POST]
